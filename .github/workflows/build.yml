name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # Weekly canary: both cloudstream deps are -SNAPSHOT, so upstream changes can
    # break the build silently. A red Monday build = calm migration, not an emergency.
    - cron: "0 6 * * 1"
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v6.0.2
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: |
          rm $GITHUB_WORKSPACE/builds/*.cs3 || true
          rm $GITHUB_WORKSPACE/builds/*.jar || true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google removed the legacy 'tools' package from the SDK repository
          # (~2026-09-15); this action's default packages input is "tools platform-tools",
          # so it now fails before anything of ours even runs. Only platform-tools was
          # ever actually needed here — AGP downloads whatever platform/build-tools
          # compileSdk requires on its own once Gradle configures the modules.
          packages: platform-tools

      # Caches gradle wrapper, dependencies and build cache between CI runs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # From upstream PR #37: lets CI cache the Gradle configuration cache.
          # Create the secret with: openssl rand -base64 16
          # (repo Settings -> Secrets and variables -> Actions -> GRADLE_ENCRYPTION_KEY)
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          ./gradlew ensureJarCompatibility
          # find instead of `cp **/build/*.cs3`: that relies on bash's globstar option,
          # which isn't enabled by default — it happens to work today only because every
          # module's build output is exactly one directory deep. find is correct
          # regardless of nesting, so it can't silently stop copying files if a module's
          # structure ever changes.
          find . -path '*/build/*.cs3' -exec cp {} $GITHUB_WORKSPACE/builds \;
          find . -path '*/build/*.jar' -exec cp {} $GITHUB_WORKSPACE/builds \; || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          # Plain append commit — NOT --amend/--force. Force-pushing rewrote the same
          # commit, which raw.githubusercontent's CDN never reliably invalidated
          # (source of the multi-hour stale plugins.json / hash mismatch).
          # A new commit = new object = clean cache bust.
          git commit -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push
